# Game/Chat sinks for the Arctis ChatMix dial (Nova Pro Omni or Nova Pro Wireless).
# Both loop back into the headset; `arctis-omni chatmix-daemon` routes them to whichever
# base station is connected (target.object below is only the initial default) and sets their volumes
# from the dial (hub in software-ChatMix mode, as GG's Sonar does on Windows).
# dont-fallback + linger: if the headset disappears, these park instead of
# rerouting to the speakers (never use dont-reconnect here).
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Arctis Game"
            capture.props = {
                node.name = "arctis_omni_game"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "arctis_omni_game_out"
                target.object = "alsa_output.usb-SteelSeries_Arctis_Nova_Pro_Omni-00.analog-stereo"
                node.dont-fallback = true
                node.linger = true
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Arctis Chat"
            capture.props = {
                node.name = "arctis_omni_chat"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "arctis_omni_chat_out"
                target.object = "alsa_output.usb-SteelSeries_Arctis_Nova_Pro_Omni-00.analog-stereo"
                node.dont-fallback = true
                node.linger = true
                audio.position = [ FL FR ]
            }
        }
    }
]
